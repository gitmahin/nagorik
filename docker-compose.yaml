networks:
  nagorik:
    driver: bridge
    name: nagorik

volumes:
  nagorik_pgData:
  nagorik_redis:
  nagorik_redisinsight:
  grafana-oss-storage:
  mongoDb:
  configMongoDb:
  mongot:
