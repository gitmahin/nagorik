  postgres:
    image: postgres:latest
    container_name: nagorik-postgres
    ports:
      - 5432:5432
    networks:
      - nagorik
    volumes:
      - nagorik_pgData:/var/lib/postgresql/MAJOR/docker
    environment:
      - POSTGRES_PASSWORD=postgres

  mongodb:
    image: mongodb/mongodb-atlas-local:preview
    hostname: mongodb
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=admin
      - MONGODB_INITDB_ROOT_PASSWORD=admin
      - VOYAGE_API_KEY=${VOYAGE_AI_API_KEY}
    ports:
      - 27017:27017
    networks:
      - nagorik
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - mongoDb:/data/db
      - configMongoDb:/data/configdb
      - mongot:/data/mongot

  redis:
    image: redis:latest
    container_name: nagorik-redis-server
    ports:
      - 6379:6379
    networks:
      - nagorik
    volumes:
      - nagorik_redis:/data
  redis_insight:
    depends_on:
      - "redis"
    image: redis/redisinsight:latest
    container_name: nagorik-redisinsight
    volumes:
      - nagorik_redisinsight:/data
    ports:
      - 5540:5540
    networks:
      - nagorik
    environment:
      - RI_REDIS_HOST_0=nagorik-redis-server
      - RI_REDIS_PORT_0=6379
      - RI_REDIS_USERNAME_0=default
      - RI_REDIS_PASSWORD_0=default
